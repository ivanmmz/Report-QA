[package]
name = "report-qa-tauri"
version = "0.1.0"
description = "Report QA - RAG System with Tauri"
authors = ["Report QA Team"]
edition = "2021"

[lib]
name = "report_qa_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
